name: apigateway-registry

on:
  workflow_dispatch:
  push:
    branches:
      - main-gateway
    paths:
      - "apigateway/**"
      - "./github/workflows/apigateway-registry.yml"

concurrency:
  group: apigateway-registry
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: apigateway 이미지 빌드 및 푸시
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 준비
        shell: bash
        run: |
          echo "IMAGE_PATH=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apigateway" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.epository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare image URI # 레지스트리 경로와 태그 조합
        id: prepare-image
        run: |
          IMAGE_PATH="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_PATH}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_PATH}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image # Dockerfile 기반 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./apigateway
          file: ./apigateway/Dockerfile
          push: true
          tags: |
            ${{ steps.prepare-image.outputs.image }}
            ${{ steps.prepare-image.outputs.latest }}
          platforms: linux/amd64
      - name: 결과 출력
        shell: bash
        run: |
          echo "완료 이미지: ${IMAGE_PATH}:${IMAGE_TAG}"
          echo "완료 이미지: ${IMAGE_PATH}:latest"